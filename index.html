<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Moments in Time — Spatial Exhibition</title>

    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400;1,6..72,500&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap"
        rel="stylesheet" />

    <style>
        :root {
            --bg-dark: #070709;
            --gold-accent: #d4af37;
            --glass-bg: rgba(22, 22, 26, 0.72);
            --glass-border: 0.5px solid rgba(255, 255, 255, 0.28);
            --font-serif: 'Newsreader', Georgia, serif;
            --font-sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
        }

        html,
        body {
            background-color: var(--bg-dark);
            color: #FFFFFF;
            font-family: var(--font-sans);
            width: 100%;
            height: 100%;
            min-height: 100vh;
            min-height: 100dvh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* FULL VIEWPORT CANVAS */
        .viewport-canvas {
            position: relative;
            width: 390px;
            height: 844px;
            background: #000000;
            border-radius: 46px;
            box-shadow: 0 30px 90px -20px rgba(0, 0, 0, 0.95), 0 0 0 1px rgba(255, 255, 255, 0.08);
            overflow: hidden;
            z-index: 5;
            touch-action: none;
            cursor: grab;
            perspective: 1200px;
            perspective-origin: center center;
            transform-style: preserve-3d;
        }

        .viewport-canvas:active {
            cursor: grabbing;
        }

        @media (max-width: 440px) {
            body {
                padding: 0;
                justify-content: flex-start;
            }

            .viewport-canvas {
                width: 100vw;
                height: 100vh;
                height: 100dvh;
                border-radius: 0;
                box-shadow: none;
            }
        }

        /* -------------------------------------------------------------
           STAGE 1: LANDING PAGE (Big Photo + Heading)
        ------------------------------------------------------------- */
        .stage-landing {
            position: absolute;
            inset: 0;
            z-index: 30;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: calc(20px + env(safe-area-inset-top, 0px)) 20px calc(20px + env(safe-area-inset-bottom, 0px));
            text-align: center;
            background: radial-gradient(circle at 50% 30%, #151419 0%, #08080a 100%);
            transform-origin: center center;
            transform-style: preserve-3d;
            will-change: transform, opacity;
        }

        .stage-header {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            z-index: 2;
        }

        .hero-heading-block {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            max-width: 320px;
        }

        /* EDITABLE HEADING */
        .landing-title {
            font-family: var(--font-serif);
            font-optical-sizing: auto;
            text-rendering: optimizeLegibility;
            font-size: clamp(20px, 5.8vw, 26px);
            font-weight: 400;
            font-style: italic;
            line-height: 1.25;
            letter-spacing: 0.02em;
            color: #FDFCF9;
        }

        /* BIG PHOTO DISPLAY (STAGE 1 & STAGE 2) */
        .stage-photo-frame {
            position: relative;
            flex: 1;
            width: 100%;
            max-width: min(340px, 88vw);
            max-height: 56vh;
            max-height: 56dvh;
            margin: 10px 0;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 28px 75px -10px rgba(0, 0, 0, 0.95), 0 0 0 1px rgba(255, 255, 255, 0.16);
            background: rgba(255, 255, 255, 0.02);
        }

        .stage-photo-frame img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
            border-radius: 18px;
        }

        .stage-footer {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            z-index: 2;
            cursor: pointer;
        }

        .scroll-down-cue {
            display: inline-flex;
            align-items: center;
            gap: 9px;
            padding: 9px 20px;
            background: var(--glass-bg);
            backdrop-filter: blur(24px) saturate(180%);
            -webkit-backdrop-filter: blur(24px) saturate(180%);
            border: var(--glass-border);
            box-shadow: 0 0 0 0.5px rgba(0, 0, 0, 0.45), inset 0 0.5px 0.5px rgba(255, 255, 255, 0.90), 0 8px 24px -4px rgba(0, 0, 0, 0.5);
            border-radius: 999px;
            font-size: 11.5px;
            font-weight: 500;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.9);
        }

        .scroll-down-cue svg {
            width: 13px;
            height: 13px;
            stroke: currentColor;
            stroke-width: 2;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        @keyframes cuePulse {
            0%, 100% {
                transform: translateY(0);
                opacity: 0.85;
            }
            50% {
                transform: translateY(4px);
                opacity: 1;
            }
        }

        /* -------------------------------------------------------------
           STAGE 2: SECOND PAGE (Photo + "Scroll Down" below)
        ------------------------------------------------------------- */
        .stage-second {
            position: absolute;
            inset: 0;
            z-index: 25;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 16px;
            padding: calc(20px + env(safe-area-inset-top, 0px)) 20px calc(20px + env(safe-area-inset-bottom, 0px));
            text-align: center;
            background: radial-gradient(circle at 50% 35%, #181520 0%, #060608 100%);
            transform-origin: center center;
            transform-style: preserve-3d;
            transform: translateY(100%);
            opacity: 0;
            will-change: transform, opacity;
            pointer-events: none;
        }

        .stage-second .stage-photo-frame {
            flex: 0 1 auto;
            max-height: 60vh;
            max-height: 60dvh;
            max-width: min(340px, 88vw);
        }

        /* -------------------------------------------------------------
       STAGE 3: THE 3D SPATIAL PHOTO ALBUM
    ------------------------------------------------------------- */
        .ambient-container {
            position: absolute;
            inset: -20px;
            overflow: hidden;
            z-index: 1;
            pointer-events: none;
        }

        .ambient-layer {
            position: absolute;
            inset: -30px;
            background-size: cover;
            background-position: center;
            filter: blur(32px) brightness(0.38) saturate(1.05);
            transform: translate3d(0, 0, 0) scale(1.12);
            opacity: 0;
            transition: opacity 0.18s linear;
            will-change: opacity;
            pointer-events: none;
        }

        .ambient-layer.visible {
            opacity: 0.88;
        }

        .ambient-container::after {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 50% 50%, rgba(0, 0, 0, 0.1) 0%, rgba(0, 0, 0, 0.8) 100%);
        }

        .book-stage {
            position: absolute;
            inset: 0;
            perspective: 1400px;
            perspective-origin: center center;
            transform-origin: center center;
            transform-style: preserve-3d;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            z-index: 10;
            opacity: 0;
            will-change: transform, opacity;
        }

        .book-page {
            position: absolute;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            transform-style: preserve-3d;
            will-change: transform;
            pointer-events: none;
        }

        .page-leaf {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            transform-origin: left center;
            transform-style: preserve-3d;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            will-change: transform;
            pointer-events: auto;
        }

        .photo-container {
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            max-width: min(370px, 92vw);
            max-height: min(640px, 76vh);
            max-height: min(640px, 76dvh);
            border-radius: 16px 24px 24px 16px;
            overflow: visible;
            box-shadow:
                0 28px 75px -12px rgba(0, 0, 0, 0.95),
                0 10px 28px -6px rgba(0, 0, 0, 0.75),
                inset 0 1px 1.5px rgba(255, 255, 255, 0.38),
                inset 0 -1px 1.5px rgba(0, 0, 0, 0.4),
                0 0 0 1px rgba(255, 255, 255, 0.16);
            transform-origin: center center;
            will-change: transform;
            transition: none;
        }

        .photo-container img {
            max-width: min(370px, 92vw);
            max-height: min(640px, 76vh);
            max-height: min(640px, 76dvh);
            width: auto;
            height: auto;
            object-fit: contain;
            display: block;
            border-radius: 16px 24px 24px 16px;
        }

        .spine-crease {
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 28px;
            background: linear-gradient(to right, rgba(0, 0, 0, 0.5) 0%, rgba(0, 0, 0, 0.12) 45%, transparent 100%);
            border-top-left-radius: 16px;
            border-bottom-left-radius: 16px;
            pointer-events: none;
            z-index: 6;
            transition: opacity 0.2s ease;
        }

        .page-shading {
            position: absolute;
            inset: 0;
            border-radius: 16px 24px 24px 16px;
            background: linear-gradient(to right, rgba(0, 0, 0, 0.5) 0%, rgba(0, 0, 0, 0.08) 45%, rgba(255, 255, 255, 0.06) 70%, rgba(0, 0, 0, 0.3) 100%);
            opacity: 0;
            pointer-events: none;
            z-index: 7;
            transition: opacity 0.05s ease;
        }

        .photo-container.is-zoomed {
            z-index: 100;
            box-shadow: 0 35px 90px rgba(0, 0, 0, 0.95);
        }

        .photo-container.is-zoomed .spine-crease,
        .photo-container.is-zoomed .page-shading {
            opacity: 0 !important;
        }

        /* Apple Glass Navigation Pill (Curatorial Indicator) */
        .apple-glass-pill {
            position: absolute;
            bottom: calc(24px + env(safe-area-inset-bottom, 0px));
            left: 50%;
            transform: translateX(-50%);
            height: 36px;
            background: var(--glass-bg);
            backdrop-filter: blur(24px) saturate(180%);
            -webkit-backdrop-filter: blur(24px) saturate(180%);
            border: var(--glass-border);
            box-shadow: 0 0 0 0.5px rgba(0, 0, 0, 0.45), inset 0 0.5px 0.5px rgba(255, 255, 255, 0.90), 0 10px 32px -4px rgba(0, 0, 0, 0.75);
            border-radius: 999px;
            display: flex;
            align-items: center;
            padding: 0 14px;
            gap: 10px;
            z-index: 50;
            pointer-events: none;
            cursor: default;
            opacity: 0;
            transition: opacity 0.4s ease, transform 0.2s ease;
            user-select: none;
            -webkit-user-select: none;
        }

        .apple-glass-pill.visible {
            opacity: 1;
            pointer-events: auto;
        }

        .glass-pill-bar {
            width: 48px;
            height: 2px;
            background: rgba(255, 255, 255, 0.18);
            border-radius: 999px;
            overflow: hidden;
            position: relative;
        }

        .glass-pill-fill {
            position: absolute;
            top: 0;
            left: 0;
            bottom: 0;
            width: 0%;
            background: #FFFFFF;
            border-radius: 999px;
            transition: width 0.12s ease-out;
        }

        .glass-pill-text {
            font-size: 11.5px;
            font-weight: 500;
            letter-spacing: 0.08em;
            color: rgba(255, 255, 255, 0.85);
            white-space: nowrap;
            font-variant-numeric: tabular-nums;
        }

        /* Top Return-to-Cover Control */
        .apple-return-btn {
            position: absolute;
            top: calc(18px + env(safe-area-inset-top, 0px));
            left: 20px;
            height: 36px;
            padding: 0 14px;
            border-radius: 999px;
            background: var(--glass-bg);
            backdrop-filter: blur(24px) saturate(180%);
            -webkit-backdrop-filter: blur(24px) saturate(180%);
            border: var(--glass-border);
            box-shadow: 0 0 0 0.5px rgba(0, 0, 0, 0.45), inset 0 0.5px 0.5px rgba(255, 255, 255, 0.90), 0 10px 32px -4px rgba(0, 0, 0, 0.75);
            display: inline-flex;
            align-items: center;
            gap: 7px;
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.85);
            z-index: 50;
            cursor: pointer;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.4s ease, transform 0.2s ease;
            user-select: none;
            -webkit-user-select: none;
        }

        .apple-return-btn:active {
            transform: scale(0.95);
        }

        .apple-return-btn.visible {
            opacity: 1;
            pointer-events: auto;
        }

        .apple-return-btn svg {
            width: 12px;
            height: 12px;
            stroke: currentColor;
            stroke-width: 2.2;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        @media (prefers-reduced-motion: reduce) {
            .stage-landing,
            .stage-second,
            .book-stage,
            .ambient-layer,
            .photo-container,
            .page-leaf,
            .apple-glass-pill,
            .apple-return-btn {
                transition-duration: 0.01ms !important;
                animation-duration: 0.01ms !important;
            }
        }
    </style>
</head>

<body>

    <main class="viewport-canvas" id="albumCanvas">

        <!-- =============================================================
             STAGE 1: THE LANDING PAGE
             Edit your Stage 1 photo and heading below!
        ============================================================= -->
        <section class="stage-landing" id="stageLanding">
            <header class="stage-header">
                <!-- EDITABLE HEADING -->
                <div class="hero-heading-block">
                    <h1 class="landing-title" id="landingTitle">HAPPY BIRTHDAY MOUPORNA</h1>
                </div>
            </header>

            <!-- EDITABLE BIG PHOTO (STAGE 1) -->
            <div class="stage-photo-frame">
                <img id="stage1Photo" src="./photos/landing.jpeg?v=landing" alt="Featured Photograph" />
            </div>

            <footer class="stage-footer">
                <div class="scroll-down-cue">
                    <span>Scroll down</span>
                    <svg viewBox="0 0 24 24"><path d="M7 10l5 5 5-5"/></svg>
                </div>
            </footer>
        </section>

        <!-- =============================================================
             STAGE 2: THE SECOND PAGE
             Second featured photo with "Scroll down" below the photo
        ============================================================= -->
        <section class="stage-second" id="stageSecond">
            <!-- EDITABLE BIG PHOTO (STAGE 2) -->
            <div class="stage-photo-frame">
                <img id="stage2Photo" src="./photos/second.jpeg?v=second" alt="Featured Photograph" />
            </div>

            <!-- "SCROLL DOWN" WRITTEN BELOW THE PHOTO -->
            <footer class="stage-footer">
                <div class="scroll-down-cue">
                    <span>Scroll down</span>
                    <svg viewBox="0 0 24 24"><path d="M7 10l5 5 5-5"/></svg>
                </div>
            </footer>
        </section>

        <!-- STAGE 3: THE SPATIAL PHOTO ALBUM -->
        <div class="ambient-container">
            <div id="ambientA" class="ambient-layer visible"></div>
            <div id="ambientB" class="ambient-layer"></div>
        </div>

        <div class="book-stage" id="bookStage"></div>
 
        <button class="apple-return-btn" id="returnCoverBtn" aria-label="Return to Cover">
            <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
            <span>Cover</span>
        </button>

        <nav class="apple-glass-pill" id="glassPill" aria-label="Album progress">
            <div class="glass-pill-bar">
                <div class="glass-pill-fill" id="glassFill"></div>
            </div>
            <span class="glass-pill-text" id="glassLabel" aria-live="polite" aria-atomic="true">01 / 25</span>
        </nav>

    </main>

    <script type="module">
        import { albumData } from './album-data.js?v=25';

        const canvas = document.getElementById('albumCanvas');
        const stage = document.getElementById('bookStage');
        const glassFill = document.getElementById('glassFill');
        const glassLabel = document.getElementById('glassLabel');
        const glassPill = document.getElementById('glassPill');
        const returnCoverBtn = document.getElementById('returnCoverBtn');
        const ambientA = document.getElementById('ambientA');
        const ambientB = document.getElementById('ambientB');

        const stageLanding = document.getElementById('stageLanding');
        const stageSecond = document.getElementById('stageSecond');
        const stage1Photo = document.getElementById('stage1Photo');
        const stage2Photo = document.getElementById('stage2Photo');

        // Continuous Macro Stage:
        // 0.0 = Stage 1 (Landing), 1.0 = Stage 2 (Second Page), 2.0 = Stage 3 (Spatial Album)
        let macroProgress = 0;
        let journeyPhase = 0;
        let isTransitioningPhase = false;
        let phaseAnimId = null;

        const TOTAL_PHOTOS = albumData.length;
        const pages = [];
        const photoUrls = new Array(TOTAL_PHOTOS);

        let currentAmbientSrcA = null;
        let currentAmbientSrcB = null;

        function setAmbientImage(elem, src) {
            if (elem === ambientA) {
                if (currentAmbientSrcA !== src) {
                    currentAmbientSrcA = src;
                    ambientA.style.backgroundImage = src ? `url('${src}')` : 'none';
                }
            } else if (elem === ambientB) {
                if (currentAmbientSrcB !== src) {
                    currentAmbientSrcB = src;
                    ambientB.style.backgroundImage = src ? `url('${src}')` : 'none';
                }
            }
        }

        // Multi-extension fallback loader
        function setupImageResolution(img, idx, id) {
            const exts = ['.jpeg', '.jpg', '.png', '.webp', '.JPG', '.JPEG', '.PNG'];
            let attempt = 0;
            img.onerror = () => {
                attempt++;
                if (attempt < exts.length) {
                    const nextSrc = `./photos/${id}${exts[attempt]}`;
                    img.src = nextSrc;
                    photoUrls[idx] = nextSrc;
                    if (idx === 0) {
                        setAmbientImage(ambientA, nextSrc);
                    }
                }
            };
        }

        // Multi-extension fallback loader for stage1Photo and stage2Photo
        function setupNamedImageResolution(img, baseName) {
            const exts = ['.jpeg', '.jpg', '.png', '.webp', '.JPG', '.JPEG', '.PNG'];
            let attempt = 0;
            img.onerror = () => {
                attempt++;
                if (attempt < exts.length) {
                    img.src = `./photos/${baseName}${exts[attempt]}`;
                }
            };
        }
        setupNamedImageResolution(stage1Photo, 'landing');
        setupNamedImageResolution(stage2Photo, 'second');

        albumData.forEach((photo, idx) => {
            const page = document.createElement('div');
            page.className = 'book-page';
            page.id = `page-${idx}`;

            const leaf = document.createElement('div');
            leaf.className = 'page-leaf';

            const container = document.createElement('div');
            container.className = 'photo-container';

            const img = document.createElement('img');
            img.src = photo.url;
            img.alt = `Photo ${photo.id}`;
            if (idx <= 1) img.fetchPriority = 'high';
            else img.loading = 'lazy';

            const spine = document.createElement('div');
            spine.className = 'spine-crease';

            const shading = document.createElement('div');
            shading.className = 'page-shading';

            photoUrls[idx] = photo.url;
            setupImageResolution(img, idx, photo.id);

            container.appendChild(img);
            container.appendChild(spine);
            container.appendChild(shading);
            leaf.appendChild(container);
            page.appendChild(leaf);
            stage.appendChild(page);

            pages.push({ page, leaf, container, img, spine, shading, id: photo.id });
        });

        // Initialize ambient background
        setAmbientImage(ambientA, './photos/landing.jpeg');
        ambientA.style.opacity = '0.88';
        ambientB.style.opacity = '0';

        // -------------------------------------------------------------
        // 3D CONTINUOUS SPATIAL STAGE TRANSITION ENGINE
        // -------------------------------------------------------------
        function renderStageTransition(progress) {
            if (progress <= 1.0) {
                if (progress < 0) {
                    // Elastic pull on Landing cover
                    const elastic = Math.tanh(progress * 1.6) * 0.32;
                    stageLanding.style.display = 'flex';
                    stageLanding.style.pointerEvents = 'auto';
                    stageLanding.style.opacity = (1 - Math.abs(elastic) * 0.25).toFixed(3);
                    stageLanding.style.transform = `translate3d(0, ${(-elastic * 75).toFixed(1)}px, 0) scale(${(1 + elastic * 0.05).toFixed(3)})`;

                    stageSecond.style.display = 'none';
                    stageSecond.style.opacity = '0';
                    stageSecond.style.pointerEvents = 'none';

                    stage.style.display = 'none';
                    stage.style.opacity = '0';
                    stage.style.pointerEvents = 'none';

                    setAmbientImage(ambientA, './photos/landing.jpeg');
                    ambientA.style.opacity = '0.88';
                    ambientB.style.opacity = '0';
                } else {
                    const p = progress;
                    // Stage 1 (Landing) recedes in 3D perspective
                    stageLanding.style.display = 'flex';
                    stageLanding.style.pointerEvents = p < 0.5 ? 'auto' : 'none';
                    const lY = -p * 100;
                    const lZ = -p * 130;
                    const lRotX = p * 10;
                    const lScale = 1 - p * 0.08;
                    const lOpacity = Math.max(0, 1 - p * 1.15);
                    stageLanding.style.transform = `translate3d(0, ${lY.toFixed(2)}%, ${lZ.toFixed(1)}px) rotateX(${lRotX.toFixed(2)}deg) scale(${lScale.toFixed(3)})`;
                    stageLanding.style.opacity = lOpacity.toFixed(3);

                    // Stage 2 (Second Page) emerges from 3D depth below
                    stageSecond.style.display = 'flex';
                    stageSecond.style.pointerEvents = p >= 0.5 ? 'auto' : 'none';
                    const sY = (1 - p) * 100;
                    const sZ = (1 - p) * -150;
                    const sRotX = (1 - p) * -10;
                    const sScale = 0.91 + p * 0.09;
                    const sOpacity = Math.min(1, Math.max(0, p * 1.25));
                    stageSecond.style.transform = `translate3d(0, ${sY.toFixed(2)}%, ${sZ.toFixed(1)}px) rotateX(${sRotX.toFixed(2)}deg) scale(${sScale.toFixed(3)})`;
                    stageSecond.style.opacity = sOpacity.toFixed(3);

                    // Stage 3 (Album) hidden
                    stage.style.display = 'none';
                    stage.style.opacity = '0';
                    stage.style.pointerEvents = 'none';

                    // Ambient crossfade
                    const s2Src = (stage2Photo && stage2Photo.src) ? stage2Photo.src : './photos/second.jpeg';
                    setAmbientImage(ambientA, './photos/landing.jpeg');
                    setAmbientImage(ambientB, s2Src);
                    ambientA.style.opacity = ((1 - p) * 0.88).toFixed(3);
                    ambientB.style.opacity = (p * 0.88).toFixed(3);
                }

                glassPill.classList.remove('visible');
                glassPill.style.opacity = '0';
                glassPill.style.pointerEvents = 'none';
                if (returnCoverBtn) {
                    returnCoverBtn.classList.remove('visible');
                    returnCoverBtn.style.opacity = '0';
                    returnCoverBtn.style.pointerEvents = 'none';
                }
            } else {
                // Between Stage 2 and Stage 3 (1.0 < progress <= 2.0)
                const p = Math.min(1, progress - 1.0);

                stageLanding.style.display = 'none';
                stageLanding.style.opacity = '0';
                stageLanding.style.pointerEvents = 'none';

                // Stage 2 recedes upward in 3D perspective
                stageSecond.style.display = 'flex';
                stageSecond.style.pointerEvents = p < 0.5 ? 'auto' : 'none';
                const sY = -p * 100;
                const sZ = -p * 130;
                const sRotX = p * 10;
                const sScale = 1 - p * 0.08;
                const sOpacity = Math.max(0, 1 - p * 1.15);
                stageSecond.style.transform = `translate3d(0, ${sY.toFixed(2)}%, ${sZ.toFixed(1)}px) rotateX(${sRotX.toFixed(2)}deg) scale(${sScale.toFixed(3)})`;
                stageSecond.style.opacity = sOpacity.toFixed(3);

                // Stage 3 (Album) glides in from 3D depth
                stage.style.display = 'flex';
                stage.style.pointerEvents = p >= 0.5 ? 'auto' : 'none';
                const bY = (1 - p) * 50;
                const bZ = (1 - p) * -140;
                const bRotX = (1 - p) * -8;
                const bScale = 0.92 + p * 0.08;
                const bOpacity = Math.min(1, Math.max(0, p * 1.25));
                stage.style.transform = `translate3d(0, ${bY.toFixed(1)}px, ${bZ.toFixed(1)}px) rotateX(${bRotX.toFixed(2)}deg) scale(${bScale.toFixed(3)})`;
                stage.style.opacity = bOpacity.toFixed(3);

                renderBookTurn(currentState, currentState);

                // Curatorial Glass Pill and Cover Return button fade in
                if (p > 0.35) {
                    const pillOp = Math.min(1, (p - 0.35) / 0.65);
                    glassPill.classList.add('visible');
                    glassPill.style.opacity = pillOp.toFixed(3);
                    glassPill.style.pointerEvents = p > 0.8 ? 'auto' : 'none';
                    if (returnCoverBtn) {
                        returnCoverBtn.classList.add('visible');
                        returnCoverBtn.style.opacity = pillOp.toFixed(3);
                        returnCoverBtn.style.pointerEvents = p > 0.8 ? 'auto' : 'none';
                    }
                } else {
                    glassPill.classList.remove('visible');
                    glassPill.style.opacity = '0';
                    glassPill.style.pointerEvents = 'none';
                    if (returnCoverBtn) {
                        returnCoverBtn.classList.remove('visible');
                        returnCoverBtn.style.opacity = '0';
                        returnCoverBtn.style.pointerEvents = 'none';
                    }
                }

                // Ambient crossfade between Second Page and Photo 01
                const s2Src = (stage2Photo && stage2Photo.src) ? stage2Photo.src : './photos/second.jpeg';
                const p1Src = photoUrls[currentState] || './photos/1.jpeg';
                setAmbientImage(ambientA, s2Src);
                setAmbientImage(ambientB, p1Src);
                ambientA.style.opacity = ((1 - p) * 0.88).toFixed(3);
                ambientB.style.opacity = (p * 0.88).toFixed(3);
            }
        }

        // Apple-style quintic stage transition snapper
        function animateStageTransition(targetMacro, duration = 440, onComplete = null) {
            if (phaseAnimId) {
                cancelAnimationFrame(phaseAnimId);
                phaseAnimId = null;
            }
            isTransitioningPhase = true;
            const fromMacro = macroProgress;
            const toMacro = targetMacro;
            const startTime = performance.now();

            function stepPhase(now) {
                const elapsed = now - startTime;
                const t = Math.min(1, elapsed / duration);
                // Apple fluid quintic deceleration curve
                const ease = 1 - Math.pow(1 - t, 3.8);
                macroProgress = fromMacro + (toMacro - fromMacro) * ease;
                renderStageTransition(macroProgress);

                if (t < 1) {
                    phaseAnimId = requestAnimationFrame(stepPhase);
                } else {
                    macroProgress = toMacro;
                    journeyPhase = Math.round(toMacro);
                    renderStageTransition(macroProgress);
                    isTransitioningPhase = false;
                    phaseAnimId = null;
                    if (onComplete) onComplete();
                }
            }

            phaseAnimId = requestAnimationFrame(stepPhase);
        }

        function setJourneyPhase(newPhase) {
            if (newPhase < 0 || newPhase > 2) return;
            if (newPhase === journeyPhase && macroProgress === newPhase) return;
            animateStageTransition(newPhase);
        }

        // Tap cues to advance directly with 3D animation
        document.querySelectorAll('.scroll-down-cue').forEach(cue => {
            cue.addEventListener('click', (e) => {
                e.stopPropagation();
                if (isTransitioningPhase) return;
                const target = journeyPhase < 1 ? 1.0 : 2.0;
                animateStageTransition(target);
            });
        });

        // Instant Return to Cover handler
        function returnToCover(e) {
            if (e) e.stopPropagation();
            if (animId) {
                cancelAnimationFrame(animId);
                animId = null;
            }
            if (phaseAnimId) {
                cancelAnimationFrame(phaseAnimId);
                phaseAnimId = null;
            }
            isTransitioning = false;
            resetZoomImmediate();
            animateStageTransition(0, 480, () => {
                currentState = 0;
                displayProgress = 0;
                renderBookTurn(0, 0);
            });
        }

        if (returnCoverBtn) {
            returnCoverBtn.addEventListener('click', returnToCover);
        }

        // -------------------------------------------------------------
        // ALBUM INTERACTION STATE & DYNAMIC ZOOM
        // -------------------------------------------------------------
        let currentState = 0;
        let displayProgress = 0;
        let isTransitioning = false;
        let animId = null;

        let isDragging = false;
        let dragStartX = 0;
        let dragStartY = 0;
        let dragFraction = 0;
        let touchHistory = [];
        let gestureAxis = null; // 'horizontal' | 'vertical' | null
        const SWIPE_PIXELS = 220;

        let zoom = {
            scale: 1,
            x: 0,
            y: 0,
            initialDist: 0,
            initialScale: 1,
            isZoomed: false,
            panStartX: 0,
            panStartY: 0
        };

        function clampPan(x, y, scale) {
            if (scale <= 1.05) return { x: 0, y: 0, maxPanX: 0, maxPanY: 0 };
            const maxPanX = (window.innerWidth * (scale - 1)) / 2;
            const maxPanY = (window.innerHeight * (scale - 1)) / 2;
            return {
                x: Math.max(-maxPanX, Math.min(maxPanX, x)),
                y: Math.max(-maxPanY, Math.min(maxPanY, y)),
                maxPanX,
                maxPanY
            };
        }

        function applyDynamicTransform(container, scale, x = 0, y = 0, animate = true) {
            zoom.scale = scale;
            zoom.x = x;
            zoom.y = y;
            zoom.isZoomed = scale > 1.05;

            container.style.transition = animate ? 'transform 0.28s cubic-bezier(0.18, 0.98, 0.28, 1)' : 'none';
            container.classList.toggle('is-zoomed', zoom.isZoomed);

            if (zoom.isZoomed) {
                container.style.transform = `translate3d(${x}px, ${y}px, 0) scale(${scale})`;
                glassPill.style.opacity = '0';
                glassPill.style.pointerEvents = 'none';
                if (returnCoverBtn) {
                    returnCoverBtn.style.opacity = '0';
                    returnCoverBtn.style.pointerEvents = 'none';
                }
            } else {
                container.style.transform = 'translate3d(0, 0, 0) scale(1)';
                glassPill.style.opacity = '';
                glassPill.style.pointerEvents = '';
                if (returnCoverBtn) {
                    returnCoverBtn.style.opacity = '';
                    returnCoverBtn.style.pointerEvents = '';
                }
                zoom.scale = 1;
                zoom.x = 0;
                zoom.y = 0;
            }
        }

        function resetZoomImmediate() {
            if (pages[currentState]) {
                applyDynamicTransform(pages[currentState].container, 1, 0, 0, false);
            }
        }

        // -------------------------------------------------------------
        // DIRECTIONAL 3D BOOK TURN ENGINE (60fps Decoupled Kinematics)
        // -------------------------------------------------------------
        function renderBookTurn(progress, anchorState = currentState) {
            // Elastic overscroll at Photo 0
            if (progress < 0) {
                const overscroll = -progress;
                const elasticFrac = Math.tanh(overscroll * 1.8) * 0.35;
                const item = pages[0];
                if (item) {
                    item.page.style.display = 'flex';
                    item.page.style.zIndex = '20';
                    item.leaf.style.transformOrigin = 'center center';
                    const ty = elasticFrac * 55;
                    const rx = elasticFrac * 7;
                    const s = 1 - elasticFrac * 0.05;
                    item.leaf.style.transform = `translate3d(0, ${ty.toFixed(1)}px, 0) rotateX(${rx.toFixed(2)}deg) scale(${s.toFixed(3)})`;
                    item.leaf.style.opacity = (1 - elasticFrac * 0.22).toFixed(3);
                    item.shading.style.opacity = (elasticFrac * 0.28).toFixed(2);
                }
                ambientA.style.opacity = (0.88 - elasticFrac * 0.25).toFixed(3);

                for (let i = 1; i < TOTAL_PHOTOS; i++) {
                    pages[i].page.style.display = 'none';
                    pages[i].page.style.zIndex = '0';
                }

                if (glassFill) glassFill.style.width = '0%';
                if (glassLabel) glassLabel.textContent = `01 / ${String(TOTAL_PHOTOS).padStart(2, '0')}`;
                return;
            }

            // Elastic overscroll at Photo 24
            if (progress > TOTAL_PHOTOS - 1) {
                const overscroll = progress - (TOTAL_PHOTOS - 1);
                const elasticFrac = Math.tanh(overscroll * 1.8) * 0.35;
                const item = pages[TOTAL_PHOTOS - 1];
                if (item) {
                    item.page.style.display = 'flex';
                    item.page.style.zIndex = '20';
                    item.leaf.style.transformOrigin = 'left center';
                    const angle = -elasticFrac * 16;
                    const zLift = elasticFrac * 22;
                    item.leaf.style.transform = `translate3d(0, 0, ${zLift.toFixed(1)}px) rotateY(${angle.toFixed(2)}deg)`;
                    item.leaf.style.opacity = '1';
                    item.shading.style.opacity = (elasticFrac * 0.38).toFixed(2);
                }

                for (let i = 0; i < TOTAL_PHOTOS - 1; i++) {
                    pages[i].page.style.display = 'none';
                    pages[i].page.style.zIndex = '0';
                }

                if (glassFill) glassFill.style.width = '100%';
                if (glassLabel) glassLabel.textContent = `${String(TOTAL_PHOTOS).padStart(2, '0')} / ${String(TOTAL_PHOTOS).padStart(2, '0')}`;
                return;
            }

            const pClamped = Math.max(0, Math.min(TOTAL_PHOTOS - 1, progress));
            const delta = pClamped - anchorState;
            const isForward = delta >= 0;

            const activeIdx = anchorState;
            const targetIdx = isForward
                ? Math.min(TOTAL_PHOTOS - 1, activeIdx + 1)
                : Math.max(0, activeIdx - 1);

            const frac = Math.abs(delta);

            for (let i = 0; i < TOTAL_PHOTOS; i++) {
                if (i !== activeIdx && i !== targetIdx) {
                    pages[i].page.style.display = 'none';
                    pages[i].page.style.zIndex = '0';
                }
            }

            if (frac === 0 || activeIdx === targetIdx) {
                const item = pages[activeIdx];
                item.page.style.display = 'flex';
                item.page.style.zIndex = '20';
                item.leaf.style.transformOrigin = 'left center';
                item.leaf.style.transform = 'translate3d(0, 0, 0) rotateY(0deg)';
                item.leaf.style.opacity = '1';
                item.shading.style.opacity = '0';

                if (photoUrls[activeIdx]) {
                    setAmbientImage(ambientA, photoUrls[activeIdx]);
                    ambientA.style.opacity = '0.88';
                    ambientB.style.opacity = '0';
                }
            } else {
                const topItem = pages[activeIdx];
                const underItem = pages[targetIdx];

                topItem.page.style.display = 'flex';
                topItem.page.style.zIndex = '30';

                underItem.page.style.display = 'flex';
                underItem.page.style.zIndex = '20';

                const zLift = Math.sin(frac * Math.PI) * 52;
                const leafOpacity = frac > 0.85 ? Math.max(0, 1 - (frac - 0.85) * 6.5) : 1;

                if (isForward) {
                    topItem.leaf.style.transformOrigin = 'left center';
                    const angle = -Math.pow(frac, 0.94) * 108;
                    const curl = Math.sin(frac * Math.PI) * 2.4;

                    topItem.leaf.style.transform = `
            translate3d(0, 0, ${zLift.toFixed(1)}px)
            rotateY(${angle.toFixed(2)}deg)
            rotateZ(${-curl.toFixed(2)}deg)
          `;
                } else {
                    topItem.leaf.style.transformOrigin = 'right center';
                    const angle = Math.pow(frac, 0.94) * 108;
                    const curl = Math.sin(frac * Math.PI) * 2.4;

                    topItem.leaf.style.transform = `
            translate3d(0, 0, ${zLift.toFixed(1)}px)
            rotateY(${angle.toFixed(2)}deg)
            rotateZ(${curl.toFixed(2)}deg)
          `;
                }

                topItem.leaf.style.opacity = leafOpacity.toFixed(3);
                topItem.shading.style.opacity = (Math.sin(frac * Math.PI) * 0.45).toFixed(2);

                const underZ = -(1 - frac) * 38;
                const underScale = 0.96 + frac * 0.04;
                underItem.leaf.style.transformOrigin = 'center center';
                underItem.leaf.style.transform = `translate3d(0, 0, ${underZ.toFixed(1)}px) scale(${underScale.toFixed(3)}) rotateY(0deg)`;
                underItem.leaf.style.opacity = '1';
                underItem.shading.style.opacity = ((1 - frac) * 0.32).toFixed(2);

                if (photoUrls[activeIdx] && photoUrls[targetIdx]) {
                    setAmbientImage(ambientA, photoUrls[activeIdx]);
                    setAmbientImage(ambientB, photoUrls[targetIdx]);
                    ambientA.style.opacity = ((1 - frac) * 0.88).toFixed(3);
                    ambientB.style.opacity = (frac * 0.88).toFixed(3);
                }
            }

            const pillIdx = Math.round(pClamped);
            if (glassFill) {
                const pct = (pClamped / (TOTAL_PHOTOS - 1)) * 100;
                glassFill.style.width = `${pct.toFixed(1)}%`;
            }
            if (glassLabel) {
                const pNum = String(pillIdx + 1).padStart(2, '0');
                const tNum = String(TOTAL_PHOTOS).padStart(2, '0');
                glassLabel.textContent = `${pNum} / ${tNum}`;
            }
        }

        // Apple-style weighted kinematics
        function snapToState(targetIdx) {
            resetZoomImmediate();
            if (animId) cancelAnimationFrame(animId);
            isTransitioning = true;

            // Lookahead preloader: eager-fetch adjacent & upcoming photos
            for (let offset = 1; offset <= 2; offset++) {
                const aheadIdx = targetIdx + offset;
                if (aheadIdx < TOTAL_PHOTOS && pages[aheadIdx] && pages[aheadIdx].img) {
                    pages[aheadIdx].img.loading = 'eager';
                }
            }
            if (targetIdx > 0 && pages[targetIdx - 1] && pages[targetIdx - 1].img) {
                pages[targetIdx - 1].img.loading = 'eager';
            }

            const fromProgress = displayProgress;
            const toProgress = Math.max(0, Math.min(TOTAL_PHOTOS - 1, targetIdx));
            const anchor = currentState;
            const startTime = performance.now();
            const distance = Math.abs(toProgress - fromProgress);
            const duration = Math.min(480, Math.max(340, 440 * Math.pow(Math.max(0.1, distance), 0.4)));

            function step(now) {
                const elapsed = now - startTime;
                const t = Math.min(1, elapsed / duration);
                // Apple-style fluid quintic deceleration curve
                const ease = 1 - Math.pow(1 - t, 3.8);

                displayProgress = fromProgress + (toProgress - fromProgress) * ease;
                renderBookTurn(displayProgress, anchor);

                if (t < 1) {
                    animId = requestAnimationFrame(step);
                } else {
                    displayProgress = toProgress;
                    currentState = toProgress;
                    renderBookTurn(currentState, currentState);
                    isTransitioning = false;
                    animId = null;
                }
            }

            animId = requestAnimationFrame(step);
        }

        // -------------------------------------------------------------
        // HIGH PERFORMANCE RAF RENDER PUMP (Decoupled Touch/Pointer)
        // -------------------------------------------------------------
        let rafPending = false;
        function scheduleRender() {
            if (rafPending) return;
            rafPending = true;
            requestAnimationFrame(() => {
                rafPending = false;
                if (journeyPhase < 2 || isTransitioningPhase) {
                    renderStageTransition(macroProgress);
                } else {
                    renderBookTurn(displayProgress, currentState);
                }
            });
        }

        // -------------------------------------------------------------
        // GESTURE CONTROLLER (Bulletproof Touch, Zoom, & Kinematic Latch)
        // -------------------------------------------------------------
        let lastTapTime = 0;
        let lastTapX = 0;
        let lastTapY = 0;
        let touchStartX = 0;
        let touchStartY = 0;
        let touchStartTime = 0;
        let isSwipeGesture = false;

        canvas.addEventListener('touchstart', (e) => {
            // Multi-touch handling: Pinch-to-zoom setup (Bug 5 fix)
            if (journeyPhase === 2 && e.touches.length === 2) {
                if (isDragging) {
                    isDragging = false;
                    dragFraction = 0;
                    snapToState(currentState);
                }
                lastTapTime = 0;
                zoom.initialDist = Math.hypot(
                    e.touches[0].clientX - e.touches[1].clientX,
                    e.touches[0].clientY - e.touches[1].clientY
                );
                zoom.initialScale = zoom.scale;
                return;
            }

            // Transition lock: ignore touches during active transition (Bug 4 fix)
            if (isTransitioning || isTransitioningPhase) {
                return;
            }

            if (e.touches.length === 1) {
                touchStartX = e.touches[0].clientX;
                touchStartY = e.touches[0].clientY;
                dragStartX = e.touches[0].clientX;
                dragStartY = e.touches[0].clientY;
                touchStartTime = performance.now();
                isSwipeGesture = false;
                gestureAxis = null;

                if (journeyPhase === 2 && zoom.isZoomed) {
                    zoom.panStartX = e.touches[0].clientX - zoom.x;
                    zoom.panStartY = e.touches[0].clientY - zoom.y;
                    return;
                }

                isDragging = true;
                dragFraction = 0;
                touchHistory = [{ x: dragStartX, y: dragStartY, t: performance.now() }];
            }
        }, { passive: true });

        canvas.addEventListener('touchmove', (e) => {
            // Two-finger pinch-to-zoom (Stage 3 only)
            if (journeyPhase === 2 && e.touches.length === 2 && zoom.initialDist > 0) {
                e.preventDefault();
                const currentDist = Math.hypot(
                    e.touches[0].clientX - e.touches[1].clientX,
                    e.touches[0].clientY - e.touches[1].clientY
                );
                const scaleFactor = currentDist / zoom.initialDist;
                const targetScale = Math.min(4.5, Math.max(1.0, zoom.initialScale * scaleFactor));
                applyDynamicTransform(pages[currentState].container, targetScale, zoom.x, zoom.y, false);
                return;
            }

            if (e.touches.length !== 1) return;

            const touchX = e.touches[0].clientX;
            const touchY = e.touches[0].clientY;
            const dx = touchX - dragStartX;
            const dy = dragStartY - touchY; // Positive = pulling UP
            const totalDist = Math.hypot(dx, dy);

            // Establish axial lock
            if (totalDist > 8) {
                isSwipeGesture = true;
                lastTapTime = 0;
                if (!gestureAxis) {
                    gestureAxis = Math.abs(dx) >= Math.abs(dy) ? 'horizontal' : 'vertical';
                }
            }

            // Zoomed pan in Stage 3
            if (journeyPhase === 2 && zoom.isZoomed) {
                e.preventDefault();
                const rawX = touchX - zoom.panStartX;
                const rawY = touchY - zoom.panStartY;
                const bounds = clampPan(rawX, rawY, zoom.scale);
                let panX = rawX;
                let panY = rawY;
                if (rawX > bounds.maxPanX) panX = bounds.maxPanX + (rawX - bounds.maxPanX) * 0.3;
                else if (rawX < -bounds.maxPanX) panX = -bounds.maxPanX + (rawX + bounds.maxPanX) * 0.3;
                if (rawY > bounds.maxPanY) panY = bounds.maxPanY + (rawY - bounds.maxPanY) * 0.3;
                else if (rawY < -bounds.maxPanY) panY = -bounds.maxPanY + (rawY + bounds.maxPanY) * 0.3;

                applyDynamicTransform(pages[currentState].container, zoom.scale, panX, panY, false);
                return;
            }

            if (!isDragging) return;

            e.preventDefault();

            const now = performance.now();
            touchHistory.push({ x: touchX, y: touchY, t: now });
            while (touchHistory.length > 2 && now - touchHistory[0].t > 120) {
                touchHistory.shift();
            }

            // STAGE 1 (Landing): 1:1 tactile 3D drag preview
            if (journeyPhase === 0) {
                const frac = dy / 300;
                macroProgress = Math.min(1.0, Math.max(-0.35, frac));
                scheduleRender();
                return;
            }

            // STAGE 2 (Second Page): 1:1 tactile 3D drag preview (up to Album or down to Landing)
            if (journeyPhase === 1) {
                const frac = dy / 300;
                macroProgress = Math.max(0.0, Math.min(2.0, 1.0 + frac));
                scheduleRender();
                return;
            }

            // STAGE 3 (Spatial Album): 3D page turn kinematics
            if (journeyPhase === 2) {
                const primaryDelta = gestureAxis === 'horizontal' ? -dx : dy;
                const rawFraction = primaryDelta / SWIPE_PIXELS;

                if (currentState === 0 && rawFraction < 0) {
                    dragFraction = -Math.tanh(Math.abs(rawFraction) * 0.9) * 0.42;
                } else if (currentState === TOTAL_PHOTOS - 1 && rawFraction > 0) {
                    dragFraction = Math.tanh(rawFraction * 0.8) * 0.32;
                } else {
                    dragFraction = Math.max(-0.95, Math.min(0.95, rawFraction));
                }

                displayProgress = currentState + dragFraction;
                scheduleRender();
            }
        }, { passive: false });

        canvas.addEventListener('touchend', () => {
            zoom.initialDist = 0;

            if (journeyPhase === 2 && zoom.scale < 1.15 && !zoom.isZoomed) {
                applyDynamicTransform(pages[currentState].container, 1, 0, 0, true);
            } else if (journeyPhase === 2 && zoom.isZoomed) {
                const clamped = clampPan(zoom.x, zoom.y, zoom.scale);
                if (zoom.x !== clamped.x || zoom.y !== clamped.y) {
                    applyDynamicTransform(pages[currentState].container, zoom.scale, clamped.x, clamped.y, true);
                }
            }

            const now = performance.now();
            const touchDuration = now - touchStartTime;

            // Intentional Double-Tap Zoom (Stage 3 only)
            if (journeyPhase === 2 && !isSwipeGesture && touchDuration < 250) {
                const tapX = touchStartX;
                const tapY = touchStartY;
                const distFromLastTap = Math.hypot(tapX - lastTapX, tapY - lastTapY);

                if (now - lastTapTime < 300 && distFromLastTap < 35) {
                    lastTapTime = 0;
                    isDragging = false;
                    const activeContainer = pages[currentState].container;

                    if (zoom.isZoomed) {
                        applyDynamicTransform(activeContainer, 1, 0, 0, true);
                    } else {
                        const rect = activeContainer.getBoundingClientRect();
                        const centerX = rect.left + rect.width / 2;
                        const centerY = rect.top + rect.height / 2;
                        const focalShiftX = (centerX - tapX) * 1.4;
                        const focalShiftY = (centerY - tapY) * 1.4;
                        const bounds = clampPan(focalShiftX, focalShiftY, 2.4);

                        applyDynamicTransform(activeContainer, 2.4, bounds.x, bounds.y, true);
                    }
                    return;
                } else {
                    lastTapTime = now;
                    lastTapX = tapX;
                    lastTapY = tapY;
                }
            } else {
                lastTapTime = 0;
            }

            if (!isDragging || (journeyPhase === 2 && zoom.isZoomed)) {
                isDragging = false;
                return;
            }
            isDragging = false;

            // Compute release velocity
            let velocity = 0;
            let axisDelta = 0;
            let dy = 0;

            if (touchHistory.length >= 2) {
                const oldest = touchHistory[0];
                const newest = touchHistory[touchHistory.length - 1];
                const dt = newest.t - oldest.t;
                dy = oldest.y - newest.y; // Positive = swiped UP
                const dx = oldest.x - newest.x;

                axisDelta = gestureAxis === 'horizontal' ? dx : dy;
                if (dt > 10) {
                    velocity = axisDelta / dt;
                }
            }

            // STAGE 1 (Landing) Release
            if (journeyPhase === 0) {
                if (dy > 42 || velocity > 0.22) {
                    animateStageTransition(1.0);
                } else {
                    animateStageTransition(0.0);
                }
                return;
            }

            // STAGE 2 (Second Page) Release
            if (journeyPhase === 1) {
                if (dy > 42 || velocity > 0.22) {
                    animateStageTransition(2.0);
                } else if (dy < -42 || velocity < -0.22) {
                    animateStageTransition(0.0);
                } else {
                    animateStageTransition(1.0);
                }
                return;
            }

            // STAGE 3 (Spatial Album) Release
            if (journeyPhase === 2) {
                // Return to Stage 2 when swiping back past threshold on Photo 0
                if (currentState === 0 && (dragFraction < -0.16 || velocity < -0.22)) {
                    animateStageTransition(1.0);
                    return;
                }

                // Snap back when pushing past last photo
                if (currentState === TOTAL_PHOTOS - 1 && dragFraction > 0) {
                    snapToState(TOTAL_PHOTOS - 1);
                    return;
                }

                let target = currentState;
                if (dragFraction > 0.16 || velocity > 0.22) {
                    target = Math.min(TOTAL_PHOTOS - 1, currentState + 1);
                } else if (dragFraction < -0.16 || velocity < -0.22) {
                    target = Math.max(0, currentState - 1);
                } else {
                    target = currentState;
                }

                snapToState(target);
            }
        });

        // -------------------------------------------------------------
        // DESKTOP POINTER / MOUSE DRAG PARITY
        // -------------------------------------------------------------
        let isPointerDragging = false;
        let pointerStartX = 0;
        let pointerStartY = 0;
        let pointerStartTime = 0;
        let pointerHistory = [];
        let pointerGestureAxis = null;

        canvas.addEventListener('pointerdown', (e) => {
            if (e.pointerType !== 'mouse' || e.button !== 0) return;
            if (isTransitioning || isTransitioningPhase) return;

            isPointerDragging = true;
            pointerStartX = e.clientX;
            pointerStartY = e.clientY;
            pointerStartTime = performance.now();
            pointerGestureAxis = null;
            dragFraction = 0;
            pointerHistory = [{ x: e.clientX, y: e.clientY, t: pointerStartTime }];

            if (journeyPhase === 2 && zoom.isZoomed) {
                zoom.panStartX = e.clientX - zoom.x;
                zoom.panStartY = e.clientY - zoom.y;
            }
        });

        window.addEventListener('pointermove', (e) => {
            if (!isPointerDragging) return;

            const dx = e.clientX - pointerStartX;
            const dy = pointerStartY - e.clientY; // Positive = pulling UP
            const totalDist = Math.hypot(dx, dy);

            if (totalDist > 6 && !pointerGestureAxis) {
                pointerGestureAxis = Math.abs(dx) >= Math.abs(dy) ? 'horizontal' : 'vertical';
            }

            if (journeyPhase === 2 && zoom.isZoomed) {
                const rawX = e.clientX - zoom.panStartX;
                const rawY = e.clientY - zoom.panStartY;
                const bounds = clampPan(rawX, rawY, zoom.scale);
                applyDynamicTransform(pages[currentState].container, zoom.scale, bounds.x, bounds.y, false);
                return;
            }

            const now = performance.now();
            pointerHistory.push({ x: e.clientX, y: e.clientY, t: now });
            while (pointerHistory.length > 2 && now - pointerHistory[0].t > 120) {
                pointerHistory.shift();
            }

            if (journeyPhase === 0) {
                const frac = dy / 300;
                macroProgress = Math.min(1.0, Math.max(-0.35, frac));
                scheduleRender();
                return;
            }

            if (journeyPhase === 1) {
                const frac = dy / 300;
                macroProgress = Math.max(0.0, Math.min(2.0, 1.0 + frac));
                scheduleRender();
                return;
            }

            if (journeyPhase === 2) {
                const primaryDelta = pointerGestureAxis === 'horizontal' ? -dx : dy;
                const rawFraction = primaryDelta / SWIPE_PIXELS;

                if (currentState === 0 && rawFraction < 0) {
                    dragFraction = -Math.tanh(Math.abs(rawFraction) * 0.9) * 0.42;
                } else if (currentState === TOTAL_PHOTOS - 1 && rawFraction > 0) {
                    dragFraction = Math.tanh(rawFraction * 0.8) * 0.32;
                } else {
                    dragFraction = Math.max(-0.95, Math.min(0.95, rawFraction));
                }

                displayProgress = currentState + dragFraction;
                scheduleRender();
            }
        });

        window.addEventListener('pointerup', (e) => {
            if (!isPointerDragging) return;
            isPointerDragging = false;

            if (journeyPhase === 2 && zoom.isZoomed) {
                const clamped = clampPan(zoom.x, zoom.y, zoom.scale);
                applyDynamicTransform(pages[currentState].container, zoom.scale, clamped.x, clamped.y, true);
                return;
            }

            let velocity = 0;
            let dy = 0;
            if (pointerHistory.length >= 2) {
                const oldest = pointerHistory[0];
                const newest = pointerHistory[pointerHistory.length - 1];
                const dt = newest.t - oldest.t;
                dy = oldest.y - newest.y; // Positive = pulled UP
                const dx = oldest.x - newest.x;
                const axisDelta = pointerGestureAxis === 'horizontal' ? dx : dy;
                if (dt > 10) {
                    velocity = axisDelta / dt;
                }
            }

            if (journeyPhase === 0) {
                if (dy > 42 || velocity > 0.22) {
                    animateStageTransition(1.0);
                } else {
                    animateStageTransition(0.0);
                }
                return;
            }

            if (journeyPhase === 1) {
                if (dy > 42 || velocity > 0.22) {
                    animateStageTransition(2.0);
                } else if (dy < -42 || velocity < -0.22) {
                    animateStageTransition(0.0);
                } else {
                    animateStageTransition(1.0);
                }
                return;
            }

            if (journeyPhase === 2) {
                if (currentState === 0 && (dragFraction < -0.16 || velocity < -0.22)) {
                    animateStageTransition(1.0);
                    return;
                }

                if (currentState === TOTAL_PHOTOS - 1 && dragFraction > 0) {
                    snapToState(TOTAL_PHOTOS - 1);
                    return;
                }

                let target = currentState;
                if (dragFraction > 0.16 || velocity > 0.22) {
                    target = Math.min(TOTAL_PHOTOS - 1, currentState + 1);
                } else if (dragFraction < -0.16 || velocity < -0.22) {
                    target = Math.max(0, currentState - 1);
                } else {
                    target = currentState;
                }

                snapToState(target);
            }
        });

        // Desktop Double Click Zoom Parity
        canvas.addEventListener('dblclick', (e) => {
            if (journeyPhase !== 2) return;
            const activeContainer = pages[currentState].container;
            if (zoom.isZoomed) {
                applyDynamicTransform(activeContainer, 1, 0, 0, true);
            } else {
                const rect = activeContainer.getBoundingClientRect();
                const centerX = rect.left + rect.width / 2;
                const centerY = rect.top + rect.height / 2;
                const focalShiftX = (centerX - e.clientX) * 1.4;
                const focalShiftY = (centerY - e.clientY) * 1.4;
                const bounds = clampPan(focalShiftX, focalShiftY, 2.4);
                applyDynamicTransform(activeContainer, 2.4, bounds.x, bounds.y, true);
            }
        });

        // Trackpad / Wheel Support with Kinetic Latch
        let wheelAccumulator = 0;
        let wheelLocked = false;
        let wheelResetTimer = null;
        const WHEEL_THRESHOLD = 45;

        window.addEventListener('wheel', (e) => {
            e.preventDefault();
            if ((journeyPhase === 2 && zoom.isZoomed) || isTransitioning || isTransitioningPhase) return;

            wheelAccumulator += e.deltaY;

            clearTimeout(wheelResetTimer);
            wheelResetTimer = setTimeout(() => {
                wheelAccumulator = 0;
                wheelLocked = false;
            }, 180);

            if (wheelLocked) return;

            if (wheelAccumulator > WHEEL_THRESHOLD) {
                wheelLocked = true;
                wheelAccumulator = 0;
                if (macroProgress < 1) {
                    animateStageTransition(1.0);
                } else if (macroProgress < 2) {
                    animateStageTransition(2.0);
                } else if (currentState < TOTAL_PHOTOS - 1) {
                    snapToState(currentState + 1);
                }
            } else if (wheelAccumulator < -WHEEL_THRESHOLD) {
                wheelLocked = true;
                wheelAccumulator = 0;
                if (macroProgress >= 2 && currentState === 0) {
                    animateStageTransition(1.0);
                } else if (macroProgress >= 2) {
                    snapToState(currentState - 1);
                } else if (macroProgress >= 1) {
                    animateStageTransition(0.0);
                }
            }
        }, { passive: false });

        // Keyboard Support with Transition Lock
        window.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' || e.key === 'Home') {
                e.preventDefault();
                if (macroProgress > 0) returnToCover();
            } else if (e.key === 'ArrowDown' || e.key === 'ArrowRight') {
                e.preventDefault();
                if (isTransitioning || isTransitioningPhase) return;
                if (macroProgress < 1) {
                    animateStageTransition(1.0);
                } else if (macroProgress < 2) {
                    animateStageTransition(2.0);
                } else if (currentState < TOTAL_PHOTOS - 1) {
                    snapToState(currentState + 1);
                }
            } else if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') {
                e.preventDefault();
                if (isTransitioning || isTransitioningPhase) return;
                if (macroProgress >= 2 && currentState === 0) {
                    animateStageTransition(1.0);
                } else if (macroProgress >= 2) {
                    snapToState(currentState - 1);
                } else if (macroProgress >= 1) {
                    animateStageTransition(0.0);
                }
            }
        });

        // Initialize at Stage 1 (Landing)
        renderStageTransition(0);

        // Expose QA API for empirical verification
        window.__ALBUM__ = {
            setJourneyPhase,
            animateStageTransition,
            snapToState,
            returnToCover,
            getState: () => ({ journeyPhase, macroProgress, currentState, isTransitioning, isTransitioningPhase })
        };
    </script>
</body>
